---
# roles/grafana_alloy/tasks/install.yml
- name: Install Grafana repository prerequisites
  ansible.builtin.apt:
    name:
      - gpg
    state: present
    update_cache: true
  tags:
    - install-alloy
    
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags:
    - install-alloy

- name: Remove legacy Grafana Alloy repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    state: absent
    filename: grafana
    update_cache: false
  tags:
    - install-alloy

- name: Remove legacy Grafana GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/grafana.gpg
    state: absent
  tags:
    - install-alloy


- name: Add Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
    force: true
  tags:
    - install-alloy

- name: Add Grafana Alloy repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana
    update_cache: false
  tags:
    - install-alloy

- name: Update apt cache and install alloy
  ansible.builtin.apt:
    name: alloy
    update_cache: yes
    state: present
  notify: Restart alloy
  tags:
    - install-alloy
